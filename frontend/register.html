<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orelega+One&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="reg-log">
    <main class="reg-log-content">
      <h1>Регистрация</h1>
      <form class="reg-log-form" method="post">
        <div class="form-item">
          <!-- телефон -->
          <label class="field__label" for="phone">Номер телефона</label>
          <input
            type="tel"
            id="phone"
            name="phone_number"
            required
            placeholder="89123456789"
            autocomplete="current-password"
          />
        </div>

        <div class="form-item">
          <label class="field__label" for="username">Логин</label>
          <input
            type="username"
            id="username"
            name="username"
            required
            placeholder=""
            autocomplete="current-password"
          />
        </div>

        <div class="form-item">
          <label class="field__label" for="first_name">Имя</label>
          <input
            type="first_name"
            id="first_name"
            name="first_name"
            required
            placeholder=""
            autocomplete="current-password"
          />
        </div>

        <div class="form-item">
          <label class="field__label" for="last_name">Фамилия</label>
          <input
            type="last_name"
            id="last_name"
            name="last_name"
            required
            placeholder=""
            autocomplete="current-password"
          />
        </div>

        <div class="form-item">
          <!-- Отчество -->
          <label class="field__label" for="father_name">Отчество</label>
          <input
            type="father_name"
            id="father_name"
            name="father_name"
            required
            placeholder=""
            autocomplete="current-password"
          />
        </div>

        <div class="form-item">
          <label class="field__label" for="password">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="reg-log-button">Зарегистрироваться</button>
      </form>
      
      <div class="error" id="errorMessage"></div>
      <a href="http://127.0.0.1:5500/frontend/login.html">Переход на страницу авторизации</a>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
